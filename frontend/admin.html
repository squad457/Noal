<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin — USDT Rewards</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { base: '#0B0F19', panel: '#121826', neon: '#10B981', cyan: '#06B6D4' },
        fontFamily: { display: ['"Space Grotesk"', 'sans-serif'], body: ['"Inter"', 'sans-serif'] },
      },
    },
  };
</script>
</head>
<body class="bg-base text-white font-body min-h-screen">

<!-- Ambient glow -->
<div class="fixed inset-0 pointer-events-none z-0">
  <div class="absolute -top-24 -left-24 w-72 h-72 bg-neon/20 rounded-full blur-[100px]"></div>
  <div class="absolute top-1/3 -right-24 w-72 h-72 bg-cyan/20 rounded-full blur-[100px]"></div>
</div>

<!-- Login gate -->
<div id="login-gate" class="admin-login relative z-10">
  <div class="glass-card p-7 w-full max-w-sm text-center">
    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-neon to-cyan flex items-center justify-center font-display font-bold text-base mx-auto mb-4">⚙️</div>
    <h1 class="font-display text-xl font-bold mb-1">Admin Access</h1>
    <p class="text-sm text-gray-400 mb-5">Enter your admin key to continue</p>
    <input id="input-admin-key" type="password" placeholder="Admin API Key"
      class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm mb-4 outline-none focus:border-neon/50 text-center" />
    <button id="btn-login" class="w-full btn-primary py-3 text-sm">Unlock Dashboard</button>
    <p id="login-error" class="text-xs text-red-400 mt-3 hidden">Invalid key — please try again.</p>
  </div>
</div>

<!-- Dashboard (hidden until unlocked) -->
<div id="dashboard" class="relative z-10 hidden pb-16">
  <header class="admin-topbar">
    <div class="admin-brand">
      <div class="mark">$</div>
      <div>
        <p class="font-display font-semibold text-base leading-none">Admin Panel</p>
        <p class="text-xs text-gray-500 mt-1">USDT Rewards</p>
      </div>
    </div>
    <button id="btn-logout" class="btn-xs ghost">Log out</button>
  </header>

  <nav class="admin-nav" id="admin-nav">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="withdrawals">Withdrawals</button>
    <button data-tab="users">Users</button>
    <button data-tab="tasks">Tasks</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="broadcast">Broadcast</button>
  </nav>

  <main class="px-4">
    <div id="admin-body"></div>
  </main>
</div>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-8 z-50 hidden"></div>

<script src="js/admin.js"></script>
</body>
</html>
