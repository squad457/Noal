<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Noal — USDT Rewards</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          base: '#0D0B1A',
          panel: '#17142C',
          violet: '#8B5CF6',
          magenta: '#EC4899',
          mint: '#3DDC97',
        },
        fontFamily: {
          display: ['"Sora"', 'sans-serif'],
          body: ['"Inter"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
      },
    },
  };
</script>
</head>
<body class="bg-base text-white font-body min-h-screen pb-28 overflow-x-hidden">

<!-- Splash / Loading Screen -->
<div id="splash">
  <div class="splash-logo">N</div>
  <p class="font-display font-bold text-base tracking-wide">Noal</p>
  <p id="splash-fallback">
    This app only opens inside Telegram.<br>
    Please launch it from <a href="https://t.me/UsdtReward1bot/app" target="_top">@UsdtReward1bot</a>.
  </p>
</div>

<!-- Signature aurora glow -->
<div class="aurora-field"></div>

<!-- Top bar -->
<header class="relative z-10 flex items-center justify-between px-5 pt-5 pb-3">
  <div class="flex items-center gap-3">
    <div id="user-avatar" class="brand-mark overflow-hidden shrink-0">N</div>
    <div>
      <span class="font-display font-bold text-lg tracking-tight">Noal</span>
      <p id="user-name-label" class="text-[10px] text-[#9B95B8] -mt-0.5 truncate max-w-[130px]"></p>
    </div>
  </div>
  <div id="streak-pill" class="pill-chip">
    <span>🔥</span><span id="streak-count">0</span>
  </div>
</header>

<!-- Views -->
<main class="relative z-10 px-4">
  <section id="view-home" class="view"></section>
  <section id="view-earn" class="view hidden"></section>
  <section id="view-wallet" class="view hidden"></section>
  <section id="view-invite" class="view hidden"></section>
</main>

<!-- Toast -->
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-28 z-50 hidden"></div>

<!-- Bottom Nav (floating pill bar) -->
<nav class="fixed bottom-4 left-4 right-4 z-40 wallet-nav">
  <div class="grid grid-cols-4 max-w-md mx-auto">
    <button data-tab="home" class="nav-btn active-nav">
      <svg viewBox="0 0 24 24" class="nav-icon"><path d="M3 11.5 12 4l9 7.5M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </button>
    <button data-tab="earn" class="nav-btn">
      <svg viewBox="0 0 24 24" class="nav-icon"><path d="M5 4h9l5 5v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 4v5h5M9 13l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Earn</span>
    </button>
    <button data-tab="wallet" class="nav-btn">
      <svg viewBox="0 0 24 24" class="nav-icon"><rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 9h18M16 14h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Wallet</span>
    </button>
    <button data-tab="invite" class="nav-btn">
      <svg viewBox="0 0 24 24" class="nav-icon"><circle cx="9" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.2a3 3 0 0 1 0 5.8M18.5 14c1.9.6 3.5 2.5 3.5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Invite</span>
    </button>
  </div>
</nav>

<script src="js/api.js"></script>
<script src="js/adsgram.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
</body>
</html>
